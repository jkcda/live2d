          - heading "基本信息" [level=2] [ref=f2e181]
          - list [ref=f2e182]:
            - listitem [ref=f2e183]: 深境螺旋位于马斯克礁上，在誓言岬的东面。
            - listitem [ref=f2e184]:
              - text: 第一次前往时，标准走法为通过誓言岬处的黑洞前往。
              - generic [ref=f2e185]:
                - text: 你可以试试游过去（不必当真，体力不够可以试试用
                - link "凯亚" [ref=f2e186] [cursor=pointer]:
                  - /url: /ys/%E5%87%AF%E4%BA%9A
                - text: 或者
                - link "芙宁娜" [ref=f2e187] [cursor=pointer]:
                  - /url: /ys/%E8%8A%99%E5%AE%81%E5%A8%9C
                - text: ）。
            - listitem [ref=f2e188]: 相传通往天空岛之人，在神之眼中——在幻视中，看到的天梯也是如此螺旋的形态。我们走向宇宙，或者下到深渊。并没有差别，因为都是未知的漆黑。
            - listitem [ref=f2e189]: 前八层称为“深境回廊”，不会刷新；第九至第十二层称为“渊月螺旋”，其中第九、第十层在N.0重置时会换一次怪，第十一、第十二层会在每月重置时换一次怪。
          - heading "提示" [level=2] [ref=f2e190]
          - paragraph [ref=f2e191]: 挑战深境螺旋时，以下小技巧或许可以降低难度：
          - list [ref=f2e192]:
            - listitem [ref=f2e193]: 因为每日的降福buff是随机的，如果今天的buff很差（如练的是元素队却给了物理伤害buff），可以“暂时离开”，明天遇到好的buff再“继续挑战”。
            - listitem [ref=f2e194]: 每一期的祝福带来的提升很可观，有条件的话可以用上。如这期是角色身上带盾加伤，那可以考虑在队伍中加入盾角色。
            - listitem [ref=f2e195]: 挑战成绩以每一间最好成绩为准。也就是说第一次这层三间分别打了3/2/1星，刷星的时候就可以不考虑第一间的时间，打过即可，而专注于第二三间的配队。即使第二次打了0/3/3星，那么你的最终成绩会是全3星（满星）。你可以根据每间怪物的特性和弱点分两到三次完成，每次将一至两间打到3星，这就是凹深渊。
            - listitem [ref=f2e196]: ESC退出时选择“暂时离开”，然后重进时选“继续挑战”，可以保留挑战进度，但不能保留半间进度。举例来说，12-2上半打完，下半主C暴毙了，于是你选择ESC-暂时离开，然后重新进入-继续挑战，那你会从12-2上半选降福buff开始。
            - listitem [ref=f2e197]:
              - text: 挑战过程中打开
              - link "冒险之证" [ref=f2e198] [cursor=pointer]:
                - /url: /ys/%E5%86%92%E9%99%A9%E4%B9%8B%E8%AF%81
              - text: （F1）、地图（M）、
              - link "祈愿" [ref=f2e199] [cursor=pointer]:
                - /url: /ys/%E7%A5%88%E6%84%BF
              - text: （F3）等界面可以达到暂停的效果。暂停时，能量球会正常流向角色，而怪物与玩家的操作及挑战倒计时均会暂停，可以借此节省等待能量球飞向角色的时间。
