          - heading "调整历史" [level=2] [ref=f2e790]
          - paragraph [ref=f2e791]: 从开服至4.6版本，渊月螺旋均为每半个月刷新一次（在每月的1号与16号），9-12层的星之秘宝奖励只有150原石（50x3）；自4.7版本第一期渊月螺旋（2024年6月下）起，渊月螺旋更改为每月刷新一次，同时将9-12层的星之秘宝奖励调整至200原石（50x2+100），满星累计可以获得800原石。 开服至5.0版本，渊月螺旋第9-11层的BOSS生命值一般为同等级大世界怪物的2倍，第12层的BOSS生命值一般为同等级大世界怪物的2.5倍。 从5.1第一期开始，第12层的生命值倍率开始发生变动，其中5.1第一期是3.75倍，5.1第二期是3倍。
