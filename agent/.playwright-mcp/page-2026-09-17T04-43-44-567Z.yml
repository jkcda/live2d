          - heading "规则：奖励与重置" [level=3] [ref=f2e387]
          - paragraph [ref=f2e388]: 攻克深境螺旋能获得不菲的奖励。每一间首次挑战成功时，都可以领取「间之秘宝」；每一层中获得一定的渊星后，能领取「星之秘宝」。奖励可以通过「奖励预览」查看。 每个月的第十六日，将会重置渊月螺旋的奖励，并可能产生新的渊月祝福。 深境回廊的奖励不会随时间重置。 5.1版本新增跳过功能，上期满星通关第11层可以跳过第9层，上期满星通关第12层则可以跳过第9和第10层。
