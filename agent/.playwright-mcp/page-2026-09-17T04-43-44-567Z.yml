          - heading "介绍" [level=2] [ref=f2e328]
          - heading "深境螺旋" [level=3] [ref=f2e329]
          - paragraph [ref=f2e330]: 由早已覆灭的远古文明，修建的巨大地下古都。究竟是出于何种目的而修建，如今已经不可知。其结构被分为连结世界的「深境回廊」与通往未知的「渊月螺旋」，故此统称为「深境螺旋」。据说，其中埋葬着早已被这个世界遗忘的秘密与宝藏… 觊觎着其中宝藏与知识的人与魔物，占据了这座螺旋塔。战胜各层各关的挑战，剿灭其中的敌人，赢得「渊星」，就能获得隐藏在其中的，某种伟大意志的嘉许吧…
          - heading "规则：渊星、间与层" [level=3] [ref=f2e331]
          - paragraph [ref=f2e332]: 深境螺旋的空间由「层」划分。每一层，包含了3「间」。 完成挑战时，能获得「渊星」。通过每一层的3间，并获得至少6颗渊星，才能获得进入下一层的资格。
          - heading "规则：深境回廊与渊月螺旋" [level=3] [ref=f2e333]
          - paragraph [ref=f2e334]: 深境螺旋由两部分组成：「深境回廊」与「渊月螺旋」。完成深境回廊所有8层后将开启「渊月螺旋」。 或许是因为某个世界的月相变动，渊月螺旋每月会自行重置一次，发生在每月的第十六日… 而连接世界与渊月螺旋，隐藏着丰厚宝藏的深境回廊，不会随时间重置与变化。
          - heading "规则：限制与地脉异常" [level=3] [ref=f2e335]
          - paragraph [ref=f2e336]: 深境螺旋的战斗中，存在各种限制。在每层的3间连续挑战中，将无法：
          - list [ref=f2e337]:
            - listitem [ref=f2e338]: 使用食物等道具；
            - listitem [ref=f2e339]: 调整队伍成员；
            - listitem [ref=f2e340]: 更换圣遗物与武器装备；
            - listitem [ref=f2e341]: 进行升级、突破等角色养成。
          - paragraph [ref=f2e342]:
            - text: 此外，在深境螺旋的每一层中，存在着各自不同的「地脉异常」，地脉异常会对其中的角色与敌人造成各种正面或负面效果。希望能高效地攻克关卡的话，在队伍配置时与战斗中，也应积极将地脉异常的效果纳入考量。
            - link "点击查看各类地脉异常" [ref=f2e343] [cursor=pointer]:
              - /url: /ys/%E6%B7%B1%E5%A2%83%E8%9E%BA%E6%97%8B#场地/光环技能
          - heading "规则：祝福与降福" [level=3] [ref=f2e344]
          - paragraph [ref=f2e345]: 挑战者会得到来自深境螺旋深处的认可与期许。这份认可与期许，能化作让人奋战不止的力量。 每两周，深境螺旋中会可能出现不同的祝福，提供各种各样的增益效果。当前周期的效果可以通过「渊月祝福」查阅。 此外，每一间开始时，可以选择一种「深秘降福」。不同的降福会拥有各异的效果，与持续时间：
          - list [ref=f2e346]:
            - listitem [ref=f2e347]: 此层生效：持续直到进入下一层；
            - listitem [ref=f2e348]: 本间生效：持续直到进入下一间；
            - listitem [ref=f2e349]: 立即生效：如字面所示，立刻发生。
          - paragraph [ref=f2e350]: 根据当前队伍的情况，选择适合的降福，能更有效地应对挑战。
          - heading "规则：路径分叉" [level=3] [ref=f2e351]
          - paragraph [ref=f2e352]: 据说深境螺旋的某些地方，存在着分岔的路径。要继续深入的话，就需要兵分两路，一同攻克… 一些间会分为上半与下半两部分。要通过的话，需要将所拥有的角色编成两支队伍，每支队伍由1~4名角色组成，分别完成上半与下半各自的挑战。两支队伍的角色不能重复。
          - heading "规则：渊月螺旋敌人生命倍率和敌人等级" [level=3] [ref=f2e353]
