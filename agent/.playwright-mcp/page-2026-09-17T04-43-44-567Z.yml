                - cell "冰牢" [ref=f2e216]
                - cell "外形像冰爪子，会困住角色无法逃脱。固定每12秒出现一次，刚出现范围预警时冲刺出冰牢范围可规避，如已经被困，则只要不动/不进行会触碰到冰牢爪子的动作就不会造成伤害。真实的物理引擎被困住了也可以长枪系角色使用重击钻出（或用高些的角色跳出）万叶/散兵可以跳/飞出去" [ref=f2e217]
